{% extends "base.html" %}
{% block title %}Categories — EventHub{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 fade-up">
    <h2 class="mb-0"><i class="bi bi-tags-fill text-gradient me-2"></i>Categories</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-glass">← Back</a>
</div>

<div class="row g-4">
    <div class="col-lg-4">
        <div class="glass-card fade-up" style="padding:1.8rem">
            <h5 class="mb-3">Add Category</h5>
            <form method="POST">
                <input type="text" name="name" class="form-control mb-3" placeholder="e.g. Workshop" required>
                <button class="btn btn-gradient w-100">Add Category</button>
            </form>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="glass-table fade-up">
            <table class="table table-hover mb-0">
                <thead><tr><th>ID</th><th>Name</th><th>Events</th><th>Action</th></tr></thead>
                <tbody>
                    {% for c in categories %}
                    <tr>
                        <td>#{{ c[0] }}</td>
                        <td><strong>{{ c[1] }}</strong></td>
                        <td>{{ c[2] }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_category', cat_id=c[0]) }}"
                                  onsubmit="return confirm('Delete category?');">
                                <button class="btn btn-outline-glass btn-sm text-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="text-center text-muted py-4">No categories yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
