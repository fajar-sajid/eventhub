{% extends "base.html" %}
{% block title %}Register — EventHub{% endblock %}

{% block content %}
<div class="glass-card auth-card fade-up">
    <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill fs-1 text-gradient"></i>
        <h2 class="mt-2">Create Account</h2>
        <p class="text-muted">Join EventHub in seconds</p>
    </div>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" placeholder="Re-enter password" minlength="6" required>
        </div>
        <button class="btn btn-gradient w-100">Create Account</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">
        Already registered? <a href="{{ url_for('login') }}" class="text-gradient fw-bold">Login</a>
    </p>
</div>
{% endblock %}
