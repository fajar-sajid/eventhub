{% extends "base.html" %}
{% block title %}Login — EventHub{% endblock %}

{% block content %}
<div class="glass-card auth-card fade-up">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill fs-1 text-gradient"></i>
        <h2 class="mt-2">Welcome Back</h2>
        <p class="text-muted">Log in to continue</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button class="btn btn-gradient w-100">Login</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">
        No account? <a href="{{ url_for('register') }}" class="text-gradient fw-bold">Register</a>
    </p>
</div>
{% endblock %}
